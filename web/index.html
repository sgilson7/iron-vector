<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps fetches on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Iron Vector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false" data-mode="loading">
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div id="reticle"></div>
    <div id="marks"></div>
    <div id="waypoint" hidden><span class="wp-label"></span><b class="wp-dist"></b></div>

    <div id="mission-box" hidden>
      <div class="mission-name" id="mission-name"></div>
      <div id="objective"></div>
      <div class="counters">
        <span id="c-hostiles"><span class="label" data-copy="hostiles"></span> <b></b></span>
        <span id="c-structures" hidden><span class="label" data-copy="structures"></span> <b></b></span>
        <span id="c-race" hidden><span class="label" data-copy="gate"></span> <b class="gate"></b> <span class="label" data-copy="place"></span> <b class="place"></b></span>
        <span id="c-time"><span class="label" data-copy="mission_timer"></span> <b></b></span>
        <span id="c-left" hidden><span class="label" data-copy="time_left"></span> <b></b></span>
      </div>
      <div id="alarm" class="warn" data-copy="alarm" hidden></div>
      <div id="scan" hidden><span class="label" data-copy="scanning"></span> <b></b></div>
      <div id="escort" hidden><span class="name"></span> <b></b><div class="bar thin"><i></i></div></div>
      <div id="plus-track" hidden></div>
    </div>

    <div id="frames"></div>

    <div class="readout" id="readout-left">
      <div><span class="label" data-copy="speed"></span> <b id="speed">0</b> <span class="unit" data-copy="kmh"></span></div>
      <div><span class="label" data-copy="alt"></span> <b id="alt">0</b> <span class="unit" data-copy="metres"></span></div>
      <div id="glide" class="flag" data-copy="glide_on" hidden></div>
      <div id="burning" class="warn" data-copy="burning" hidden></div>
      <div id="jammed" class="warn" data-copy="jammed" hidden></div>
    </div>
    <div class="readout" id="readout-right">
      <span class="label" data-copy="kills"></span> <b id="kills">0</b>
    </div>

    <div id="gauges">
      <div class="ap-row"><span class="label" data-copy="ap"></span> <b id="ap">0</b><span id="staggered" class="warn" data-copy="staggered" hidden></span></div>
      <div class="bar" id="ap-bar"><i></i></div>
      <div class="bar thin stagger" id="stagger-bar"><i></i></div>
      <div class="en-row"><span class="label" data-copy="en"></span><span id="en-out" class="warn" data-copy="en_out" hidden></span><span id="qb" class="flag" data-copy="qb"></span></div>
      <div class="bar en" id="en-bar"><i></i></div>
    </div>

    <div id="weapons">
      <div class="weapon" id="w0"><span class="wname"></span><b class="ammo"></b><div class="bar thin"><i></i></div></div>
      <div class="weapon" id="w1"><span class="wname"></span><b class="ammo"></b><div class="bar thin"><i></i></div></div>
      <div class="weapon" id="w2"><span class="wname"></span><b class="ammo"></b><div class="bar thin"><i></i></div></div>
    </div>
  </div>

  <section id="garage" class="screen" hidden>
    <div class="col left">
      <header>
        <h1 data-copy="title"></h1>
        <p class="sub" data-copy="garage"></p>
      </header>
      <h2 data-copy="slots_title"></h2>
      <ol id="slots" class="list"></ol>
      <h2 data-copy="parts_title"></h2>
      <ol id="parts" class="list"></ol>
    </div>
    <div class="col middle">
      <p class="hint" data-copy="garage_hint"></p>
      <div id="detail" class="card">
        <div class="card-head"><b id="detail-name"></b><span id="detail-kind"></span></div>
        <div id="detail-maker" class="maker"></div>
        <p id="detail-blurb"></p>
        <p id="detail-lock" class="lock"></p>
        <table id="detail-rows"></table>
      </div>
    </div>
    <div class="col right">
      <h2 data-copy="stats_title"></h2>
      <table id="stats"></table>
      <ul id="warnings"></ul>
      <h2 data-copy="paint_title"></h2>
      <div id="paints"></div>
      <div class="actions">
        <button id="to-test" type="button" class="secondary" data-copy="test_field"></button>
        <button id="to-map" type="button" data-copy="missions_button"></button>
      </div>
      <h2 data-copy="save_title"></h2>
      <p class="hint" data-copy="save_note"></p>
      <div class="actions save-actions">
        <button id="save-game" type="button" class="secondary" data-copy="save_game"></button>
        <button id="load-game" type="button" class="secondary" data-copy="load_game"></button>
        <button id="load-everything" type="button" class="secondary" data-copy="load_everything"></button>
        <button id="restart" type="button" class="secondary danger" data-copy="restart"></button>
      </div>
      <input id="save-file" type="file" accept=".json,application/json" hidden>
      <p id="save-status" role="status"></p>
      <p class="build" id="build"></p>
    </div>
  </section>

  <section id="select" class="screen" hidden>
    <div id="map-top">
      <h1 data-copy="star_map_title"></h1>
      <p id="map-progress"></p>
      <p class="hint" data-copy="star_map_hint"></p>
    </div>
    <div id="hotspots"></div>
    <aside id="map-panel" class="card">
      <h2 id="planet-name"></h2>
      <p id="planet-blurb"></p>
      <p id="planet-gimmick" class="gimmick"></p>
      <p id="planet-tally" class="tally"></p>
      <p id="planet-lock" class="lock"></p>
      <ol id="mission-list"></ol>
      <div class="actions">
        <button id="map-back" type="button" class="secondary" data-copy="back"></button>
        <button id="launch" type="button" data-copy="launch" disabled></button>
      </div>
    </aside>
  </section>

  <section id="debrief" class="screen panel-screen" hidden>
    <div class="panel">
      <p class="sub" id="debrief-mission"></p>
      <h1 id="debrief-title"></h1>
      <p id="debrief-reason" class="lock"></p>
      <table id="debrief-rows">
        <tr><td data-copy="debrief_time"></td><td id="d-time"></td></tr>
        <tr><td data-copy="debrief_ap"></td><td id="d-ap"></td></tr>
        <tr><td data-copy="debrief_kills"></td><td id="d-kills"></td></tr>
        <tr><td data-copy="debrief_rank"></td><td id="d-rank" class="rank"></td></tr>
      </table>
      <ul id="d-rewards"></ul>
      <p id="d-plus" class="gimmick"></p>
      <div class="actions">
        <button id="debrief-garage" type="button" class="secondary" data-copy="to_garage"></button>
        <button id="debrief-map" type="button" class="secondary" data-copy="to_map"></button>
        <button id="retry" type="button" data-copy="retry"></button>
      </div>
    </div>
  </section>

  <div id="overlay" class="panel-screen">
    <div class="panel">
      <h1 data-copy="title"></h1>
      <p data-copy="tagline"></p>
      <p id="status" data-copy="loading"></p>
      <p id="message" role="status"></p>
      <div class="actions">
        <button id="abort" type="button" class="secondary" data-copy="abort" hidden></button>
        <button id="start" type="button" data-copy="resume" hidden></button>
      </div>
      <h2 data-copy="controls_title"></h2>
      <table class="controls"></table>
      <p class="hint" data-copy="esc_hint"></p>
    </div>
  </div>

  <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
